[package]
name = "ratatui-sectioned-list"
version = "0.2.0"
edition = "2021"
description = "Layout, focus, scroll, and hit-test primitives for a sectioned (header + variable-height row) list — UI-framework agnostic, pure u16 geometry."
license = "Apache-2.0"
repository = "https://github.com/deck-support/ratatui-sectioned-list"
keywords = ["ratatui", "tui", "widget", "list", "scroll"]
categories = ["command-line-interface"]
readme = "README.md"
exclude = [
    "/.github/",
    "/SCR-*.png",
    "/.gitignore",
]

[features]
# On by default: this crate is built for ratatui users, so the `StatefulWidget`
# wrapper + `BasicItem` preset (see `widget` module) ship out of the box.
# Opt out with `default-features = false` for just the pure-u16 geometry core,
# which is UI-framework agnostic and zero-dependency.
default = ["ratatui"]
ratatui = ["dep:ratatui"]

[dependencies]
ratatui = { version = "0.30", optional = true }

[dev-dependencies]
ratatui = "0.30"

# The interactive demos render through the widget wrapper (default feature).
[[example]]
name = "ratatui_sidebar"
required-features = ["ratatui"]

[[example]]
name = "preset"
required-features = ["ratatui"]
